[package]
name = "autokan"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
ammonia = "4"
argon2 = "0.5"
axum = { version = "0.8", features = ["multipart", "macros"] }
axum-extra = { version = "0.10", features = ["cookie", "form"] }
base64 = "0.22"
futures-util = "0.3"
hex = "0.4"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
maud = { version = "0.27", features = ["axum"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "mysql"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls"] }
tokio-util = { version = "0.7", features = ["compat"] }
async-trait = "0.1"
samael = { version = "0.0.22", optional = true }
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }

[profile.dev.package."*"]
opt-level = 1

[features]
default = ["saml"]
# SAML sign-in. Needs the libxml2 and xmlsec1 C libraries (and libclang for bindgen) at build time;
# build with `--no-default-features` to leave it out.
saml = ["dep:samael"]
