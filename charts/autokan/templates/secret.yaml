{{- if or (and .Values.database.url (not .Values.database.existingSecret)) (and .Values.breakglass.password (not .Values.breakglass.existingSecret)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "autokan.secretName" . }}
  labels:
    {{- include "autokan.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and .Values.database.url (not .Values.database.existingSecret) }}
  database-url: {{ .Values.database.url | quote }}
  {{- end }}
  {{- if and .Values.breakglass.password (not .Values.breakglass.existingSecret) }}
  breakglass-password: {{ .Values.breakglass.password | quote }}
  {{- end }}
{{- end }}
